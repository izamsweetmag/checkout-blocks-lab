# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "929ca5ff8763f01837176b43592dd41f"
name = "checkout-blocks-lab"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Copies the VAT relief declaration off the order's attributes and line
  # properties onto typed order metafields. See webhooks.orders.create.tsx.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_orders is needed to set order metafields from the orders/create webhook,
# and orders topics require read access to subscribe at all. Orders are
# protected customer data — the app needs that access approved in the Partner
# dashboard before the subscription will deliver.
scopes = "write_products,read_publications,write_publications,write_validations,write_orders"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
