query RunInput {
  # Which stage the buyer is at. The same function runs on cart writes and at
  # checkout, so without this there is no way to require something that only
  # exists at checkout — asking for it on a cart write would reject the cart for
  # missing a box the buyer has not been shown yet.
  buyerJourney {
    step
  }
  cart {
    # Written by the checkout UI extension when the buyer ticks the declaration.
    # Cart-level, not per line: it is one attestation covering the whole order.
    checkoutConfirmation: attribute(key: "_vat_relief_confirmed_at") {
      value
    }
    lines {
      id
      quantity
      # Written by the cart-page checkbox. Its ABSENCE is the whole point of
      # this function: a zero-rated line with no declaration attached.
      declaration: attribute(key: "VAT relief declaration") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          # Only the zero-rated counterpart carries this metafield, so its
          # presence identifies a relief line without needing option parsing.
          reliefPair: metafield(namespace: "vat_relief", key: "original_variant") {
            value
          }
          product {
            title
          }
        }
      }
    }
  }
}
