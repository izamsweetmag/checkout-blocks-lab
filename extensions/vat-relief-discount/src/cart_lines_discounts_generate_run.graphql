query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      # Line item property written by the cart-page checkbox.
      vatRelief: attribute(key: "VAT relief") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            # Server-side eligibility check: only products carrying the tag
            # can ever get the deduction, no matter what the property says.
            hasTags(tags: ["VAT Exempt Opt"]) {
              tag
              hasTag
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
